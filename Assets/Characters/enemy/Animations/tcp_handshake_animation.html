<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
  <span style="font-size:13px;color:var(--text-secondary)" id="status-label">Ready</span>
  <button onclick="runAnim()" id="play-btn">Play animation</button>
</div>
<svg width="100%" viewBox="0 0 680 300" role="img">
<title>TCP three-way handshake, data transfer, and retransmission</title>
<desc>Animated diagram showing a client and server exchanging SYN, SYN-ACK, ACK packets, then data with acknowledgements, then a lost packet being retransmitted</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="c-blue" x="30" y="20" width="140" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="42" text-anchor="middle" dominant-baseline="central">Client</text>

<rect class="c-teal" x="510" y="20" width="140" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="42" text-anchor="middle" dominant-baseline="central">Server</text>

<line x1="100" y1="64" x2="100" y2="280" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="580" y1="64" x2="580" y2="280" stroke="var(--border-strong)" stroke-width="0.5"/>

<text class="ts" id="lbl1" x="340" y="95" text-anchor="middle" opacity="0">SYN</text>
<text class="ts" id="lbl2" x="340" y="130" text-anchor="middle" opacity="0">SYN + ACK</text>
<text class="ts" id="lbl3" x="340" y="165" text-anchor="middle" opacity="0">ACK</text>
<text class="ts" id="lbl4" x="340" y="200" text-anchor="middle" opacity="0">DATA</text>
<text class="ts" id="lbl5" x="340" y="235" text-anchor="middle" opacity="0">DATA (lost)</text>
<text class="ts" id="lbl6" x="340" y="265" text-anchor="middle" opacity="0">Retransmit</text>

<circle id="pkt" cx="100" cy="90" r="6" class="c-amber" opacity="0"/>
</svg>
<script>
let running = false;
function setLabel(id, on){ document.getElementById(id).setAttribute('opacity', on ? 1 : 0.15); }
function moveDot(fromX, toX, y, dur, cb, fade){
  const dot = document.getElementById('pkt');
  dot.setAttribute('opacity', 1);
  dot.setAttribute('cy', y);
  dot.setAttribute('cx', fromX);
  const start = performance.now();
  function step(t){
    const p = Math.min(1, (t - start) / dur);
    const x = fromX + (toX - fromX) * p;
    dot.setAttribute('cx', x);
    if(p < 1){ requestAnimationFrame(step); }
    else {
      if(fade){ dot.setAttribute('opacity', 0); }
      if(cb) cb();
    }
  }
  requestAnimationFrame(step);
}
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
async function runAnim(){
  if(running) return;
  running = true;
  document.getElementById('play-btn').setAttribute('disabled','true');
  const status = document.getElementById('status-label');
  ['lbl1','lbl2','lbl3','lbl4','lbl5','lbl6'].forEach(id => setLabel(id, false));

  status.textContent = 'Step 1 of 3 — connection establishment';
  setLabel('lbl1', true);
  await new Promise(r => moveDot(100, 580, 90, 700, r));
  await wait(150);
  setLabel('lbl2', true);
  await new Promise(r => moveDot(580, 100, 125, 700, r));
  await wait(150);
  setLabel('lbl3', true);
  await new Promise(r => moveDot(100, 580, 160, 700, r));
  await wait(400);

  status.textContent = 'Step 2 of 3 — data transfer';
  setLabel('lbl4', true);
  await new Promise(r => moveDot(100, 580, 195, 700, r));
  await wait(400);

  status.textContent = 'Step 3 of 3 — packet lost and retransmitted';
  setLabel('lbl5', true);
  await new Promise(r => moveDot(100, 340, 230, 500, r, true));
  await wait(400);
  setLabel('lbl6', true);
  await new Promise(r => moveDot(100, 580, 260, 700, r));
  await wait(300);

  status.textContent = 'Done — replay anytime';
  document.getElementById('play-btn').removeAttribute('disabled');
  running = false;
}
</script>
